global:
  evaluation_interval: 1m
  scrape_interval: 1m
  external_labels:
    prometheus: cattle-monitoring-system/rancher-monitoring-prometheus
    prometheus_replica: prometheus-rancher-monitoring-prometheus-0
rule_files:
- /etc/prometheus/rules/prometheus-rancher-monitoring-prometheus-rulefiles-0/*.yaml
scrape_configs:
- job_name: cattle-monitoring-system/rancher-monitoring-alertmanager/0
  honor_labels: false
  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - cattle-monitoring-system
  metrics_path: /metrics
  relabel_configs:
  - action: keep
    source_labels:
    - __meta_kubernetes_service_label_app
    regex: rancher-monitoring-alertmanager
  - action: keep
    source_labels:
    - __meta_kubernetes_service_label_release
    regex: rancher-monitoring
  - action: keep
    source_labels:
    - __meta_kubernetes_service_label_self_monitor
    regex: "true"
  - action: keep
    source_labels:
    - __meta_kubernetes_endpoint_port_name
    regex: web
  - source_labels:
    - __meta_kubernetes_endpoint_address_target_kind
    - __meta_kubernetes_endpoint_address_target_name
    separator: ;
    regex: Node;(.*)
    replacement: ${1}
    target_label: node
  - source_labels:
    - __meta_kubernetes_endpoint_address_target_kind
    - __meta_kubernetes_endpoint_address_target_name
    separator: ;
    regex: Pod;(.*)
    replacement: ${1}
    target_label: pod
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_service_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_service_name
    target_label: job
    replacement: ${1}
  - target_label: endpoint
    replacement: web
