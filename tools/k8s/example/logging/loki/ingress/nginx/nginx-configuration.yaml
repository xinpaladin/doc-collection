apiVersion: v1
data:
  client-body-buffer-size: 128k
  client-header-buffer-size: 512k
  large-client-header-buffers: 4 512k
  log-format-upstream: '{"msec": "$msec","connection": "$connection","connection_requests":
    "$connection_requests","pid": "$pid","request_id": "$request_id","request_length":
    "$request_length","remote_addr": "$remote_addr", "remote_user": "$remote_user",
    "remote_port": "$remote_port", "time_local": "$time_local", "time_iso8601": "$time_iso8601",
    "request": "$request", "request_uri": "$request_uri", "args": "$args", "status":
    "$status", "body_bytes_sent": "$body_bytes_sent", "bytes_sent": "$bytes_sent",
    "http_referer": "$http_referer", "http_user_agent": "$http_user_agent", "http_x_forwarded_for":
    "$http_x_forwarded_for", "http_host": "$http_host", "server_name": "$server_name",
    "request_time": "$request_time", "upstream": "$upstream_addr", "upstream_connect_time":
    "$upstream_connect_time", "upstream_header_time": "$upstream_header_time", "upstream_response_time":
    "$upstream_response_time", "upstream_response_length": "$upstream_response_length",
    "upstream_cache_status": "$upstream_cache_status", "ssl_protocol": "$ssl_protocol",
    "ssl_cipher": "$ssl_cipher", "scheme": "$scheme", "request_method": "$request_method",
    "server_protocol": "$server_protocol", "pipe": "$pipe", "gzip_ratio": "$gzip_ratio",
    "http_cf_ray": "$http_cf_ray","geoip_country_code": "$geoip_country_code"}'
  map-hash-bucket-size: "128"
  proxy-body-size: 50m
  proxy-buffer-size: 256k
  server-name-hash-bucket-size: "128"
  ssl-ciphers: ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA
  ssl-protocols: TLSv1 TLSv1.1 TLSv1.2
kind: ConfigMap
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"v1","data":null,"kind":"ConfigMap","metadata":{"annotations":{},"labels":{"app":"ingress-nginx"},"name":"nginx-configuration","namespace":"ingress-nginx"}}
  labels:
    app: ingress-nginx
  name: nginx-configuration
  namespace: ingress-nginx