filebeat.prospectors:
  - type: log
    tail_files: true
    multiline.pattern: '(^\[)|(^[0-9]{4}[-:][0-9]{2}[-:][0-9]{2})'
    multiline.negate: true
    multiline.match: after
    enabled: true
    paths:
      - /opt/apache-tomcat-6.0.35/logs/catalina.out
      - /opt/apache-tomcat-6.0.35/logs/common-all.log
      - /opt/apache-tomcat-6.0.35/logs/common-error.log
      - /opt/apache-tomcat-6.0.35/logs/common-warn.log
    fields:
      app_id: "101011"
      service: "SMS-CORE"
      ip_address: 10.60.0.173
      topic: qh_app_raw_log
  filebeat.config.modules:
    path: ${path.config}/modules.d/*.yml
    paths:
      - /opt/apache-tomcat-6.0.35/logs/catalina.out
      - /opt/apache-tomcat-6.0.35/logs/common-all.log
      - /opt/apache-tomcat-6.0.35/logs/common-error.log
      - /opt/apache-tomcat-6.0.35/logs/common-warn.log
    fields:
      app_id: "101011"
      service: "SMS-CORE"
      ip_address: 10.60.0.173
      topic: qh_app_raw_log
  filebeat.config.modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false
  setup.template.settings:
    index.number_of_shards: 3
  setup.kibana:
  output.kafka:
    enabled: true
    hosts: ["10.60.4.246:9092","10.60.4.247:9092","10.50.5.57:9092","10.50.5.58:9092"]
    max_message_bytes: 1000000
    topic: '%{[fields][topic]}'
  max_procs: 1 
  queue.mem.events: 256
  queue.mem.flush.min_events: 128
  logging.level: info
  logging.to_files: true
  logging.files:
    path: /var/log/filebeat
    name: filebeat
    keepfiles: 7
    permissions: 0644
  filebeat.registry_file_permissions: 0644
  xpack.monitoring:
    enabled: true
    elasticsearch:
    hosts: ["http://10.50.5.53:8080","http://10.50.5.54:8080","http://10.60.4.242:8080","http://10.60.4.243:8080"]
