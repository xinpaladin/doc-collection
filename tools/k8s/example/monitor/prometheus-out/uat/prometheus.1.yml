# prometheus.yml
global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 10.60.80.251:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

remote_write:
    - url: "http://localhost:8086/api/v1/prom/write?db=prometheus&u=prometheus&p=aaaaa888"
remote_read:
    - url: "http://localhost:8086/api/v1/prom/read?db=prometheus&u=prometheus&p=aaaaa888"

scrape_configs:
  - job_name: 'nodes'
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: ["__meta_consul_dc"]
        regex: "(.*)"
        replacement: $1
        action: replace
        target_label: "dc"
      - source_labels: ["__meta_consul_tags"]
        regex: ",(.*),"
        replacement: $1
        action: replace
        target_label: "mon_type"
      - source_labels: ["__meta_consul_tags"]
        regex: ",,"
        action: drop
      - source_labels: ["__meta_consul_tags"]
        regex: ".*,database,.*"
        action: drop
    basic_auth:
        username: "prometheus"
        password: "aaaaa888"
    consul_sd_configs:
      - server: 10.60.80.251:8500
        scheme: http
        token: c6307b36-f74a-de4b-7aed-aeefc8c68031
  - job_name: 'databases'
    scrape_interval: 30s
    scrape_timeout: 30s
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: ["__meta_consul_dc"]
        regex: "(.*)"
        replacement: $1
        action: replace
        target_label: "dc"
      - source_labels: ["__meta_consul_tags"]
        regex: ",database,(.*),"
        replacement: $1
        action: replace
        target_label: "dbname"
      - source_labels: ["__meta_consul_tags"]
        regex: ",(.*),"
        replacement: $1
        action: replace
        target_label: "mon_type"
      - source_labels: ["__meta_consul_tags"]
        regex: ".*,database,.*"
        action: keep
    consul_sd_configs:
      - server: 10.60.80.251:8500
        scheme: http
        token: c6307b36-f74a-de4b-7aed-aeefc8c68031
  - job_name: 'kubernetes-apiservers-other-cluster'
    kubernetes_sd_configs:
    - role: endpoints
      api_server: https://10.60.208.25:6443
      bearer_token: k8s.token
      tls_config:
        insecure_skip_verify: true
    scheme: https
    bearer_token: k8s.token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
      - target_label: __address__
        replacement: 10.60.208.25:6443
  - job_name: 'kubernetes-nodes-other-cluster'
    kubernetes_sd_configs:
    - role: node
      api_server: https://10.60.208.25:6443
      tls_config:
        insecure_skip_verify: true
      bearer_token: k8s.token
    tls_config:
      insecure_skip_verify: true
    bearer_token: k8s.token
    scheme: https
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: 10.60.208.25:6443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics
  - job_name: 'kubernetes-nodes-cadvisor-other-cluster'
    kubernetes_sd_configs:
    - role: node
      api_server: https://10.60.208.25:6443
      tls_config:
        insecure_skip_verify: true
      bearer_token: k8s.token
    tls_config:
      insecure_skip_verify: true
    bearer_token: k8s.token
    scheme: https
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: 10.60.208.25:6443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  - job_name: 'kubernetes-kube-service-endpoints-other-cluster'
    kubernetes_sd_configs:
    - role: endpoints
      api_server: https://10.60.208.25:6443
      tls_config:
        insecure_skip_verify: true
      bearer_token: k8s.token
    tls_config:
      insecure_skip_verify: true
    bearer_token: k8s.token
    scheme: https
    relabel_configs:
    - source_labels: [__meta_kubernetes_service_label_component]
      action: keep
      regex: '^(node-exporter|kube-state-metrics)$'
    - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__address__]
      action: replace
      target_label: instance
    - target_label: __address__
      replacement: 10.60.208.25:6443
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_container_port_number]
      regex: ([^;]+);([^;]+);([^;]+)
      target_label: __metrics_path__
      replacement: /api/v1/namespaces/${1}/pods/http:${2}:${3}/proxy/metrics
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_service_name]
      action: replace
      target_label: kubernetes_name