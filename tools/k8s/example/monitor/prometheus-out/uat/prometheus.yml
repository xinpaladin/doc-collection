# prometheus.yml
global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 10.60.80.251:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

remote_write:
    - url: "http://localhost:8086/api/v1/prom/write?db=prometheus&u=prometheus&p=aaaaa888"
remote_read:
    - url: "http://localhost:8086/api/v1/prom/read?db=prometheus&u=prometheus&p=aaaaa888"

scrape_configs:
  - job_name: 'nodes'
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: ["__meta_consul_dc"]
        regex: "(.*)"
        replacement: $1
        action: replace
        target_label: "dc"
      - source_labels: ["__meta_consul_tags"]
        regex: ",(.*),"
        replacement: $1
        action: replace
        target_label: "mon_type"
      - source_labels: ["__meta_consul_tags"]
        regex: ",,"
        action: drop
      - source_labels: ["__meta_consul_tags"]
        regex: ".*,database,.*"
        action: drop
    basic_auth:
        username: "prometheus"
        password: "aaaaa888"
    consul_sd_configs:
      - server: 10.60.80.251:8500
        scheme: http
        token: c6307b36-f74a-de4b-7aed-aeefc8c68031
  - job_name: 'databases'
    scrape_interval: 30s
    scrape_timeout: 30s
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: ["__meta_consul_dc"]
        regex: "(.*)"
        replacement: $1
        action: replace
        target_label: "dc"
      - source_labels: ["__meta_consul_tags"]
        regex: ",database,(.*),"
        replacement: $1
        action: replace
        target_label: "dbname"
      - source_labels: ["__meta_consul_tags"]
        regex: ",(.*),"
        replacement: $1
        action: replace
        target_label: "mon_type"
      - source_labels: ["__meta_consul_tags"]
        regex: ".*,database,.*"
        action: keep
    consul_sd_configs:
      - server: 10.60.80.251:8500
        scheme: http
        token: c6307b36-f74a-de4b-7aed-aeefc8c68031
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
    - role: endpoints
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    scheme: https
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
      action: keep
      regex: default;kubernetes;https
  - job_name: 'kubernetes-nodes'
    scheme: https
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: node
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)

  # This is required for Kubernetes 1.7.3 and later
  - job_name: 'kubernetes-cadvisor'
    scheme: https
    metrics_path: /metrics/cadvisor
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: node
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)

  - job_name: 'kubernetes-service-endpoints'
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    kubernetes_sd_configs:
    - role: endpoints
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_service_name]
      action: replace
      target_label: kubernetes_name

  - job_name: 'kubernetes-services'

    metrics_path: /probe
    params:
      module: [http_2xx]
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: service
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - target_label: __address__
      replacement: blackbox-exporter.example.com:9115
    - source_labels: [__param_target]
      target_label: instance
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_service_name]
      target_label: kubernetes_name

  - job_name: 'kubernetes-ingresses'

    metrics_path: /probe
    params:
      module: [http_2xx]
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: ingress
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - source_labels: [__meta_kubernetes_ingress_scheme,__address__,__meta_kubernetes_ingress_path]
      regex: (.+);(.+);(.+)
      replacement: ${1}://${2}${3}
      target_label: __param_target
    - target_label: __address__
      replacement: blackbox-exporter.example.com:9115
    - source_labels: [__param_target]
      target_label: instance
    - action: labelmap
      regex: __meta_kubernetes_ingress_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_ingress_name]
      target_label: kubernetes_name

  - job_name: 'kubernetes-pods'
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: pod
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_pod_name]
      action: replace
      target_label: kubernetes_pod_name
  - job_name: cattle-monitoring-system/rancher-monitoring-kube-state-metrics/0
    honor_labels: true
    honor_timestamps: true
    scrape_interval: 1m
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    bearer_token_file: k8s.token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
    - role: endpoints
      api_server: https://10.60.208.25:6443  # apiserver 地址
      bearer_token_file: k8s.token
      tls_config:
        insecure_skip_verify: true
      namespaces:
        names:
        - cattle-monitoring-system
    relabel_configs:
    - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
      separator: ;
      regex: rancher-monitoring
      replacement: $1
      action: keep
    - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
      separator: ;
      regex: kube-state-metrics
      replacement: $1
      action: keep
    - source_labels: [__meta_kubernetes_endpoint_port_name]
      separator: ;
      regex: http
      replacement: $1
      action: keep
    - source_labels: [__meta_kubernetes_endpoint_address_target_kind, __meta_kubernetes_endpoint_address_target_name]
      separator: ;
      regex: Node;(.*)
      target_label: node
      replacement: ${1}
      action: replace
    - source_labels: [__meta_kubernetes_endpoint_address_target_kind, __meta_kubernetes_endpoint_address_target_name]
      separator: ;
      regex: Pod;(.*)
      target_label: pod
      replacement: ${1}
      action: replace
    - source_labels: [__meta_kubernetes_namespace]
      separator: ;
      regex: (.*)
      target_label: namespace
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_service_name]
      separator: ;
      regex: (.*)
      target_label: service
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_pod_name]
      separator: ;
      regex: (.*)
      target_label: pod
      replacement: $1
      action: replace
    - source_labels: [__meta_kubernetes_service_name]
      separator: ;
      regex: (.*)
      target_label: job
      replacement: ${1}
      action: replace
    - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
      separator: ;
      regex: (.+)
      target_label: job
      replacement: ${1}
      action: replace
    
    - source_labels: [__address__]
      action: replace
      target_label: instance
    - target_label: __address__
      # 使用replacement值替换__address__默认值
      replacement: 10.60.208.25:6443
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_container_port_number]
      # 正则匹配
      regex: ([^;]+);([^;]+);([^;]+)
      # 使用replacement值替换__metrics_path__默认值
      target_label: __metrics_path__
      # 自行构建的apiserver proxy url
      replacement: /api/v1/namespaces/${1}/pods/http:${2}:${3}/proxy/metrics
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - separator: ;
      regex: (.*)
      target_label: endpoint
      replacement: http
      action: replace