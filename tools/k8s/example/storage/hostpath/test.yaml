apiVersion: v1
kind: Pod
metadata:
  name: test-pd
spec:
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
    - mountPath: /nginx
      name: test-volume
  volumes:
  - name: test-volume
    hostPath:
      # directory location on hosta
      path: /etc
      # this field is optional
      type: Directory
  tolerations:
  - effect: NoExecute
    operator: Exists
  - effect: NoSchedule
    operator: Exists
  nodeSelector:
    kubernetes.io/hostname: dmz-master-1